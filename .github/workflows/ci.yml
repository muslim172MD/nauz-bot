name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile nauz_bot.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Dependency check
        run: pip check

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Scan repository for secrets
        run: |
          python -m pip install detect-secrets
          detect-secrets scan --all-files --exclude-files '(^|/)\\.git/' > /tmp/secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/secrets.json").read_text())
          findings = data.get("results", {})
          if findings:
              print("Potential secrets detected:")
              for path, items in findings.items():
                  print(f"- {path}: {len(items)} finding(s)")
              raise SystemExit(1)
          print("No potential secrets detected in tracked files.")
          PY
